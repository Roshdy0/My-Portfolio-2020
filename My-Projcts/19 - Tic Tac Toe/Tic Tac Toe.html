<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="Tic Tac Toe.css">

</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <h1 class="player" id="player"></h1>
        <div class="board" id="board">
            <button data-index="0" class="cell"></button>
            <button data-index="1" class="cell"></button>
            <button data-index="2" class="cell"></button>
            <button data-index="3" class="cell"></button>
            <button data-index="4" class="cell"></button>
            <button data-index="5" class="cell"></button>
            <button data-index="6" class="cell"></button>
            <button data-index="7" class="cell"></button>
            <button data-index="8" class="cell"></button>
        </div>
        <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>

    <script src="Tic Tac Toe.js"></script>
</body>
</html>
